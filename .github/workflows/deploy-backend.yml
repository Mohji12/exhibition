name: Deploy backend

on:
  push:
    branches: [main, update-from-local]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "backend/"
          target: "/tmp/exhibition-backend-upload"
          overwrite: true
          strip_components: 0

      - name: Sync and restart API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEST=/home/ubuntu/exhibition/backend
            SRC=/tmp/exhibition-backend-upload/backend
            mkdir -p "$DEST"
            rsync -a --delete \
              --exclude '.env' \
              --exclude 'exhibition/' \
              --exclude '__pycache__/' \
              --exclude '*.pyc' \
              "$SRC/" "$DEST/"
            sed -i 's/\r$//' "$DEST/deploy/deploy.sh"
            chmod +x "$DEST/deploy/deploy.sh"
            "$DEST/deploy/deploy.sh"
            rm -rf /tmp/exhibition-backend-upload
